name: Node.js CICD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:

    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Use Node.js 
      uses: actions/setup-node@v4
      with:
        node-version: '23'

    - name: Frontend Compilation (Syntax check)
      run: |
        cd client
        find . -name "*.js" -exec node --check {} +
    - name: Backend Compilation (Syntax check)
      run: |
        cd api
        find . -name "*.js" -exec node --check {} +

  gitleaks-scan:
    runs-on: ubuntu-latest
    needs: compile
    
    steps:
      - name: Chekout code
        uses: actions/checkout@v4

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        
      - name: Gitleaks scan
        run: |
          gitleaks detect --source ./client --exit-code 1
          gitleaks detect --source ./api --exit-code 1  
  trivy_fs_scan:
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          ignore-unfixed: true
          vuln-type: 'os,library'
          security: 'CRITICAL,HIGH'

  sonar-frontend:
    runs-on: ubuntu-latest
    needs: trivy_fs_scan
    steps:
     - name: Chekout code
       uses: actions/checkout@v4

     - name: SonarQube Scan (client)
       uses: sonarsource/sonarqube-scan-action@v6
       with:
          projectBaseDir: client
          args: >
            -Dsonar.projectName=myorg_client
            -Dsonar.projectKey=myorg_client
            -Dsonar.sources=.
            
       env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          
  sonar-backend:
    runs-on: ubuntu-latest
    needs: sonar-frontend
    steps:
     - name: Chekout code
       uses: actions/checkout@v4

     - name: SonarQube Scan (api)
       uses: sonarsource/sonarqube-scan-action@v6
       with:
          projectBaseDir: api
          args: >
            -Dsonar.projectName=myorg_api
            -Dsonar.projectKey=myorg_api
            -Dsonar.sources=.
           
       env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build_backend_docker_image_and_push:
    runs-on: ubuntu-latest
    needs: sonar-backend

    steps:
      - name: Chekout code
        uses: actions/checkout@v4
      - name: Login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build and Push Docker images
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: yadevpro/backend:latest
          file: ./api/Dockerfile
  build_frontend_docker_image_and_push:
    runs-on: ubuntu-latest
    needs: sonar-backend

    steps:
      - name: Chekout code
        uses: actions/checkout@v4
      - name: Login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build and Push Docker images
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: yadevpro/frontend:latest
          file: ./api/Dockerfile

          
      


        





    
