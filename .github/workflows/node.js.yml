
name: Node.js CICD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: Agent-1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Frontend Compilation (Syntax Check)
        run: |
          cd client
          find . -name "*.js" -not -path "*/node_modules/*" -exec node --check {} +

      - name: Backend Compilation (Syntax Check)
        run: |
          cd api
          find . -name "*.js" -not -path "*/node_modules/*" -exec node --check {} +

  gitleaks-scan:
    runs-on: Agent-1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

  trivy_fs_scan:
    runs-on: Agent-1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

  sonar-frontend:
    runs-on: Agent-1
    needs: [build, gitleaks-scan, trivy_fs_scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SonarQube Scan (Client)
        uses: sonarsource/sonarqube-scan-action@v6
        with:
          projectBaseDir: client
          args: >
            -Dsonar.projectName=myorg_client
            -Dsonar.projectKey=myorg_client
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  sonar-backend:
    runs-on: Agent-1
    needs: [build, gitleaks-scan, trivy_fs_scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SonarQube Scan (API)
        uses: sonarsource/sonarqube-scan-action@v6
        with:
          projectBaseDir: api
          args: >
            -Dsonar.projectName=myorg_api
            -Dsonar.projectKey=myorg_api
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
